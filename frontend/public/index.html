    <div id="root">
      <style>
        #root {
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          background: #0F0F1A;
        }
        .loader {
          text-align: center;
        }
        .loader-logo {
          width: 56px;
          height: 56px;
          border-radius: 14px;
          background: linear-gradient(135deg, #4F46E5, #7C3AED);
          margin: 0 auto 16px;
          animation: pulse 1.5s ease-in-out infinite;
        }
        .loader-text {
          color: #8892B0;
          font-family: 'Inter', -apple-system, sans-serif;
          font-size: 16px;
          font-weight: 500;
          letter-spacing: -0.3px;
        }
        @keyframes pulse {
          0%, 100% { transform: scale(1); opacity: 1; }
          50% { transform: scale(1.08); opacity: 0.8; }
        }
      </style>
      <div class="loader">
        <div class="loader-logo"></div>
        <div class="loader-text">EdSpace загружается...</div>
      </div>
    </div>
