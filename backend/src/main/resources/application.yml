spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/tutor_workspace}
    username: ${DB_USERNAME:tutor_user}
    password: ${DB_PASSWORD:tutor_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        enable_lazy_load_no_trans: true
  jackson:
    serialization:
      indent-output: true
      fail-on-empty-beans: false
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

logging:
  level:
    com.example.demo: ${LOG_LEVEL:INFO}
    com.example.demo.service: ${LOG_LEVEL:INFO}
    com.example.demo.controller: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} - %-5level - %logger{36} - %msg%n"
  file:
    name: logs/tutor-workspace.log
    max-size: 10MB
    max-history: 30

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}
  base-url: ${APP_BASE_URL:http://localhost:3000}

stepik:
  client:
    id: ${STEPIK_CLIENT_ID}
    secret: ${STEPIK_CLIENT_SECRET}
  redirect:
    uri: ${STEPIK_REDIRECT_URI:http://localhost:3000/stepik/callback}

yandex:
  api:
    key: ${YANDEX_API_KEY}
  folder:
    id: ${YANDEX_FOLDER_ID}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

jitsi:
  domain: ${JITSI_DOMAIN:meet.jit.si}

excalidraw:
  url: ${EXCALIDRAW_URL:https://excalidraw.com}

yookassa:
  shop-id: ${YOOKASSA_SHOP_ID}
  secret-key: ${YOOKASSA_SECRET_KEY}
  return-url: ${APP_BASE_URL:http://localhost:3000}/payment/callback
  test: true  # ✅ Тестовый режим ЮKassa