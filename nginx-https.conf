server {
    listen 80;
    server_name ed-space.ru www.ed-space.ru 72.56.238.224;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ed-space.ru www.ed-space.ru 72.56.238.224;

    ssl_certificate /etc/letsencrypt/live/ed-space.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ed-space.ru/privkey.pem;

    root /usr/share/nginx/html;
    index index.html index.htm;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Excalidraw — фронтенд (lmstutor-excalidraw)
    location /excalidraw/ {
        proxy_pass http://lmstutor-excalidraw:80/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Статические файлы Excalidraw (должны быть перед общим location /)
    location ~ ^/(index-.*\.(js|css)|mermaid-to-excalidraw-.*\.js|assets/|fonts/|Excalifont-.*\.woff2|Nunito-.*\.woff2|Assistant-.*\.woff2|ComicShanns-.*\.woff2|workbox-.*\.js|sw\.js) {
        proxy_pass http://lmstutor-excalidraw:80;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://lmstutor-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        alias /opt/EdSpace/uploads/;
        autoindex off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}