server {
    listen 80;
    server_name ed-space.ru www.ed-space.ru 72.56.238.224;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ed-space.ru www.ed-space.ru 72.56.238.224;

    ssl_certificate /etc/letsencrypt/live/ed-space.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ed-space.ru/privkey.pem;

    root /usr/share/nginx/html;
    index index.html index.htm;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # ========== SECURITY HEADERS ==========
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://meet.jit.si https://excalidraw.com https://telemost.yandex.ru https://zoom.us https://*.zoom.us; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://ed-space.ru wss://ed-space.ru https://meet.jit.si wss://meet.jit.si https://excalidraw.com wss://excalidraw.com https://telemost.yandex.ru wss://telemost.yandex.ru https://zoom.us wss://zoom.us https://*.zoom.us wss://*.zoom.us; media-src 'self' blob: https://meet.jit.si https://telemost.yandex.ru https://zoom.us https://*.zoom.us; frame-src 'self' https://meet.jit.si https://meet.ed-space.ru https://excalidraw.com https://telemost.yandex.ru https://zoom.us https://*.zoom.us https://skype.com https://*.skype.com https://web.skype.com https://chromedino.com; frame-ancestors 'self';" always;

    # ========== WBO (БЕЛАЯ ДОСКА) ==========
    location /wbo/ {
        rewrite ^/wbo/(.*)$ /$1 break;
        proxy_pass http://lmstutor-wbo:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========== EXCALIDRAW (приоритетные локации) ==========
    location ^~ /excalidraw/ {
        rewrite ^/excalidraw(/.*)$ $1 break;
        proxy_pass http://lmstutor-excalidraw:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        
        sub_filter_types text/html;
        sub_filter 'src="/assets/' 'src="/excalidraw/assets/';
        sub_filter 'href="/assets/' 'href="/excalidraw/assets/';
        sub_filter '"/assets/' '"/excalidraw/assets/';
        sub_filter '"/fonts/' '"/excalidraw/fonts/';
        sub_filter '"/manifest.webmanifest"' '"/excalidraw/manifest.webmanifest"';
        sub_filter '"/service-worker.js"' '"/excalidraw/service-worker.js"';
        sub_filter '"/sw.js"' '"/excalidraw/sw.js"';
        sub_filter '"/workbox-' '"/excalidraw/workbox-';
        sub_filter_once off;
    }

    location ^~ /excalidraw/assets/ {
        rewrite ^/excalidraw/assets/(.*) /assets/$1 break;
        proxy_pass http://lmstutor-excalidraw:80;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /excalidraw/fonts/ {
        rewrite ^/excalidraw/fonts/(.*) /fonts/$1 break;
        proxy_pass http://lmstutor-excalidraw:80;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ========== API ==========
    location /api/ {
        proxy_pass http://lmstutor-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        alias /opt/EdSpace/uploads/;
        autoindex off;
    }

    # ========== REACT SPA ==========
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэширование статики React (не перехватывает /excalidraw/)
    location ~* ^/(?!excalidraw/).*\.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}