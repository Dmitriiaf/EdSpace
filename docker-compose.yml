# ========== docker-compose.yml (v3 — чистый + volume для JAR) ==========
services:
  postgres:
    image: postgres:15-alpine
    container_name: lmstutor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tutor_workspace
      POSTGRES_USER: tutor_user
      POSTGRES_PASSWORD: tutor_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - lmstutor-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor_user -d tutor_workspace"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lmstutor-backend
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - ./uploads:/opt/EdSpace/uploads
      - ./backend/target/demo-0.0.1-SNAPSHOT.jar:/app/app.jar
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/tutor_workspace
      DB_USERNAME: tutor_user
      DB_PASSWORD: tutor_password
      SERVER_PORT: 8080
      JITSI_DOMAIN: meet.jit.si
      APP_BASE_URL: https://ed-space.ru
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lmstutor-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lmstutor-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./uploads:/opt/EdSpace/uploads
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx-https.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - lmstutor-network

  wbo:
    image: lovasoa/wbo:latest
    container_name: lmstutor-wbo
    restart: unless-stopped
    networks:
      - lmstutor-network

volumes:
  postgres_data:

networks:
  lmstutor-network:
    driver: bridge