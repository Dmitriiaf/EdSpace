# ========== docker-compose.yml (добавлен APP_BASE_URL) ==========
services:
  postgres:
    image: postgres:15-alpine
    container_name: lmstutor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tutor_workspace
      POSTGRES_USER: tutor_user
      POSTGRES_PASSWORD: tutor_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - lmstutor-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor_user -d tutor_workspace"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lmstutor-backend
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - ./uploads:/opt/EdSpace/uploads
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/tutor_workspace
      DB_USERNAME: tutor_user
      DB_PASSWORD: tutor_password
      SERVER_PORT: 8080
      JITSI_DOMAIN: meet.jit.si
      APP_BASE_URL: https://ed-space.ru
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lmstutor-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lmstutor-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./uploads:/opt/EdSpace/uploads
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx-https.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - lmstutor-network

  # Excalidraw — фронтенд
  excalidraw:
    image: excalidraw/excalidraw:latest
    container_name: lmstutor-excalidraw
    restart: unless-stopped
    networks:
      - lmstutor-network

  glitchtip-postgres:
    image: postgres:15-alpine
    container_name: glitchtip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - glitchtip_db:/var/lib/postgresql/data
    networks:
      - lmstutor-network

  glitchtip-web:
    image: glitchtip/glitchtip:latest
    container_name: glitchtip-web
    restart: unless-stopped
    depends_on:
      - glitchtip-postgres
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://postgres@glitchtip-postgres/postgres
      SECRET_KEY: EdSpace_GlitchTip_2026_SecureKey!
      GLITCHTIP_DOMAIN: https://ed-space.ru
      DEFAULT_FROM_EMAIL: noreply@ed-space.ru
      ENABLE_USER_REGISTRATION: "False"
      VALKEY_URL: ""
    networks:
      - lmstutor-network

volumes:
  postgres_data:
  glitchtip_db:

networks:
  lmstutor-network:
    driver: bridge